<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        />

        <title>Frontend Mentor | Blog preview card</title>

        <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
        <style>
            .attribution {
                font-size: 0.6875rem;
                text-align: center;
            }
            .attribution a {
                color: hsl(228, 45%, 44%);
            }
        </style>
    </head>
    <body>
        <main>
            <section class="card">
                <img
                    src="assets/images/illustration-article.svg"
                    alt="Geometiric inllustration of code course preview with tag sign"
                    class="card__preview"
                />
                <p class="card__tag">Learning</p>
                <p class="card__date">Published 21 Dec 2023</p>
                <h2 class="card__title">HTML & CSS foundations</h2>
                <p class="card__description">
                    These languages are the backbone of every website, defining
                    structure, content, and presentation.
                </p>
                <div class="card__author">
                    <img
                        src="assets/images/image-avatar.webp"
                        alt="Rounded photo of the Greg Hooper, author of the course"
                    />
                    <p class="card__creator-name">Greg Hooper</p>
                </div>
            </section>
        </main>

        

        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by <a href="#">Your Name Here</a>.
        </footer>
    </body>
</html>
